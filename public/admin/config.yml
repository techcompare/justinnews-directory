backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "tools"
    label: "Tech Tools"
    folder: "src/content/tools"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tool Name", name: "title", widget: "string" }
      - { label: "Website URL", name: "url", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["AI Tools", "Developer Resources", "Design & Icons", "Marketing Tools"] }
      - { label: "Logo/Thumbnail", name: "logo", widget: "image" }
      - { label: "Short Description", name: "description", widget: "text" }
      - { label: "Body Content (Optional Details)", name: "body", widget: "markdown", required: false }
